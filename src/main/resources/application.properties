spring.application.name=ClassAssignment
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/sampledb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Fixed address for this demo's one Feign client (InventoryClient). A real
# deployment would resolve "inventory-service" through service discovery
# (Eureka, Consul, Kubernetes DNS) instead of a hardcoded host:port.
inventory.service.url=http://localhost:8081
# Fail fast rather than hang: with the default (much longer) timeouts, killing
# inventory-service to demo a downstream failure would make every call wait
# a full minute before erroring out.
feign.client.config.default.connect-timeout=1000
feign.client.config.default.read-timeout=1000
